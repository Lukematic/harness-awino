# live-mission — run the agentic-learning mission against a REAL model.
#
# Nothing on the model side is scripted. proof/live_mission/run_live.py plays
# only the human (messages, contract + scope approval, Approve clicks); the
# model you name does everything else through the same sidecar the VS Code
# extension runs. The report records what fired and what did not — it never
# forces a pass.
#
# No key needed by default: the endpoint defaults to GitHub Models, which
# this workflow calls with its own GITHUB_TOKEN (permissions: models: read).
# Other providers need a secret (Settings -> Secrets and variables -> Actions):
#   AWINO_API_KEY      for provider "openai" (OpenRouter, OpenAI, your gateway)
#   ANTHROPIC_API_KEY  for provider "anthropic"
# Run: Actions -> live-mission -> Run workflow -> fill provider/endpoint/model.
# Output: the "live-mission" artifact (report.md, the files the model wrote,
# the journal, timeline.json, and a video of the chat UI) + the job summary.

name: live-mission

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "openai (any OpenAI-compatible endpoint) or anthropic"
        required: true
        default: openai
        type: choice
        options: [openai, anthropic]
      endpoint:
        description: "Base URL (openai provider). Default: GitHub Models (free, no key)"
        required: false
        default: https://models.github.ai/inference/chat/completions
      model:
        description: "Model id at that endpoint"
        required: true
        default: openai/gpt-4.1-mini
      flow:
        description: "quick (Quick path + a worktree agent), mission (the agentic-learning mission), or both"
        required: true
        default: quick
        type: choice
        options: [quick, mission, both]

permissions:
  contents: read
  models: read

jobs:
  live-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe the endpoint (status and headers only)
        if: inputs.provider == 'openai' && startsWith(inputs.endpoint, 'https://models.github.ai/')
        env:
          GH_MODELS_TOKEN: ${{ github.token }}
          IN_ENDPOINT: ${{ inputs.endpoint }}
          IN_MODEL: ${{ inputs.model }}
        run: |
          curl -sS -o /tmp/probe-body -D - -X POST "$IN_ENDPOINT" \
            -H "Authorization: Bearer $GH_MODELS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"model\":\"$IN_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Say ok\"}],\"max_tokens\":5}" || true
          head -c 400 /tmp/probe-body; echo

      - name: Run the mission against the live model
        env:
          AWINO_API_KEY: ${{ secrets.AWINO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_ENDPOINT: ${{ inputs.endpoint }}
          IN_MODEL: ${{ inputs.model }}
          IN_FLOW: ${{ inputs.flow }}
          GH_MODELS_TOKEN: ${{ github.token }}
        run: |
          # GitHub Models: the workflow token is the key (it is only ever
          # sent to models.github.ai). Its per-request output cap is 4000.
          if [ "$IN_PROVIDER" = "openai" ] && [[ "$IN_ENDPOINT" == https://models.github.ai/* ]]; then
            export AWINO_API_KEY="$GH_MODELS_TOKEN" AWINO_MAX_TOKENS=4000
          fi
          ARGS=(--provider "$IN_PROVIDER" --model "$IN_MODEL" --out live-out)
          if [ "$IN_PROVIDER" = "openai" ]; then ARGS+=(--endpoint "$IN_ENDPOINT"); fi
          if [ "$IN_FLOW" != "mission" ]; then
            python proof/live_mission/run_quick_live.py "${ARGS[@]}"
          fi
          if [ "$IN_FLOW" != "quick" ]; then
            python proof/live_mission/run_live.py "${ARGS[@]}"
          fi

      - name: Job summary
        if: always()
        run: |
          cat live-out/quick-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat live-out/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 20

      - name: Record the chat UI replay
        if: always()
        working-directory: proof/demo-agentic-learning
        run: |
          [ -f ../../live-out/timeline.json ] || exit 0
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node record_video.js ../../live-out/timeline.json ../../live-out/video

      - name: Upload everything the run produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mission
          path: live-out/
          if-no-files-found: warn
