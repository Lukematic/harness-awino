<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awino Mission Chat</title>
<style>
  /* ============================================================
   * Awino Wakandan chat theme — design tokens (§1.1).
   * All custom properties are --awino-*. Concrete hex values live
   * ONLY in these token blocks. Every rule below pairs
   * var(--vscode-*, <concrete fallback>) — zero bare hex outside.
   * Motifs frozen per §1.2: 3px gold chevron band (approval cards
   * only), 8px Kimoyo beads (statusline), 2px dotted gold left
   * border (thinking sections). Nothing else decorative.
   * ============================================================ */
  :root {
    color-scheme: dark;
    --awino-bg: #111A2E;
    --awino-bg-2: #172036;
    --awino-bg-3: #1E2A45;
    --awino-vibranium: #00C6FF;
    --awino-vibranium-deep: #0B7FA6;
    --awino-vibranium-dim: rgba(0,198,255,.12);
    --awino-gold: #D4A937;
    --awino-gold-bright: #F0C94A;
    --awino-gold-dim: rgba(212,169,55,.12);
    --awino-text: #DCE7F7;
    --awino-muted: #8B98B0;
    --awino-ok: #4EC9B0;
    --awino-danger: #F14C4C;
    --awino-warn: #CCA700;
    --awino-thinking-bg: rgba(212,169,55,.05);
    --awino-diff-add: rgba(78,201,176,.14);
    --awino-diff-del: rgba(241,76,76,.14);
    --awino-ok-dim: rgba(78,201,176,.14);
    --awino-danger-dim: rgba(241,76,76,.14);
    --awino-on-vibranium: #04222E;
    --awino-chevron: repeating-linear-gradient(135deg, var(--awino-gold) 0 2px, transparent 2px 9px);
  }
  body.vscode-dark {
    color-scheme: dark;
    --awino-bg: #111A2E;
    --awino-bg-2: #172036;
    --awino-bg-3: #1E2A45;
    --awino-vibranium: #00C6FF;
    --awino-vibranium-deep: #0B7FA6;
    --awino-vibranium-dim: rgba(0,198,255,.12);
    --awino-gold: #D4A937;
    --awino-gold-bright: #F0C94A;
    --awino-gold-dim: rgba(212,169,55,.12);
    --awino-text: #DCE7F7;
    --awino-muted: #8B98B0;
    --awino-ok: #4EC9B0;
    --awino-danger: #F14C4C;
    --awino-warn: #CCA700;
    --awino-thinking-bg: rgba(212,169,55,.05);
    --awino-diff-add: rgba(78,201,176,.14);
    --awino-diff-del: rgba(241,76,76,.14);
    --awino-ok-dim: rgba(78,201,176,.14);
    --awino-danger-dim: rgba(241,76,76,.14);
    --awino-on-vibranium: #04222E;
  }
  body.vscode-light {
    color-scheme: light;
    --awino-bg: #F6F1E5;
    --awino-bg-2: #FFFEFA;
    --awino-bg-3: #ECE4D0;
    --awino-vibranium: #0B7FA6;
    --awino-vibranium-deep: #0B5A78;
    --awino-vibranium-dim: rgba(11,127,166,.12);
    --awino-gold: #8A6D1F;
    --awino-gold-bright: #8A6D1F;
    --awino-gold-dim: rgba(138,109,31,.14);
    --awino-text: #2B2517;
    --awino-muted: #77694F;
    --awino-ok: #1E7E5A;
    --awino-danger: #C42B2B;
    --awino-warn: #8A6D00;
    --awino-thinking-bg: rgba(138,109,31,.06);
    --awino-diff-add: rgba(30,126,90,.14);
    --awino-diff-del: rgba(196,43,43,.12);
    --awino-ok-dim: rgba(30,126,90,.14);
    --awino-danger-dim: rgba(196,43,43,.12);
    --awino-on-vibranium: #FFFFFF;
  }
  /* ---------- explicit theme variants (user refinement 2026-09-23) ----------
   * .awino-vibranium: lifted dark ("a little lighter", no pitch-black).
   * .awino-savanna: warm light variant. Same design language (beads,
   * chevrons, geometric motifs), different light. Later in the sheet than
   * the vscode-* blocks, so a manual toggle overrides the VS Code default
   * at equal specificity. */
  body.awino-vibranium {
    color-scheme: dark;
    --awino-bg: #111A2E;
    --awino-bg-2: #172036;
    --awino-bg-3: #1E2A45;
    --awino-vibranium: #00C6FF;
    --awino-vibranium-deep: #0B7FA6;
    --awino-vibranium-dim: rgba(0,198,255,.12);
    --awino-gold: #D4A937;
    --awino-gold-bright: #F0C94A;
    --awino-gold-dim: rgba(212,169,55,.12);
    --awino-text: #DCE7F7;
    --awino-muted: #8B98B0;
    --awino-ok: #4EC9B0;
    --awino-danger: #F14C4C;
    --awino-warn: #CCA700;
    --awino-thinking-bg: rgba(212,169,55,.05);
    --awino-diff-add: rgba(78,201,176,.14);
    --awino-diff-del: rgba(241,76,76,.14);
    --awino-ok-dim: rgba(78,201,176,.14);
    --awino-danger-dim: rgba(241,76,76,.14);
    --awino-on-vibranium: #04222E;
    --awino-chevron: repeating-linear-gradient(135deg, var(--awino-gold) 0 2px, transparent 2px 9px);
  }
  body.awino-savanna {
    color-scheme: light;
    --awino-bg: #F6F1E5;
    --awino-bg-2: #FFFEFA;
    --awino-bg-3: #ECE4D0;
    --awino-vibranium: #0B7FA6;
    --awino-vibranium-deep: #0B5A78;
    --awino-vibranium-dim: rgba(11,127,166,.12);
    --awino-gold: #8A6D1F;
    --awino-gold-bright: #8A6D1F;
    --awino-gold-dim: rgba(138,109,31,.14);
    --awino-text: #2B2517;
    --awino-muted: #77694F;
    --awino-ok: #1E7E5A;
    --awino-danger: #C42B2B;
    --awino-warn: #8A6D00;
    --awino-thinking-bg: rgba(138,109,31,.06);
    --awino-diff-add: rgba(30,126,90,.14);
    --awino-diff-del: rgba(196,43,43,.12);
    --awino-ok-dim: rgba(30,126,90,.14);
    --awino-danger-dim: rgba(196,43,43,.12);
    --awino-on-vibranium: #FFFFFF;
    --awino-chevron: repeating-linear-gradient(135deg, var(--awino-gold) 0 2px, transparent 2px 9px);
  }
  body.vscode-high-contrast {
    color-scheme: dark;
    --awino-bg: var(--vscode-editor-background, #000000);
    --awino-bg-2: var(--vscode-editor-background, #000000);
    --awino-bg-3: var(--vscode-input-background, #0A0A0A);
    --awino-vibranium: var(--vscode-textLink-foreground, #00C6FF);
    --awino-vibranium-deep: var(--vscode-textLink-foreground, #0B7FA6);
    --awino-vibranium-dim: rgba(0,198,255,.12);
    --awino-gold: var(--vscode-editorWarning-foreground, #D4A937);
    --awino-gold-bright: var(--vscode-editorWarning-foreground, #F0C94A);
    --awino-gold-dim: rgba(212,169,55,.12);
    --awino-text: var(--vscode-foreground, #FFFFFF);
    --awino-muted: var(--vscode-descriptionForeground, #9E9E9E);
    --awino-ok: var(--vscode-testing-iconPassed, #4EC9B0);
    --awino-danger: var(--vscode-testing-iconFailed, #F14C4C);
    --awino-warn: var(--vscode-testing-iconQueued, #CCA700);
    --awino-thinking-bg: rgba(212,169,55,.05);
    --awino-diff-add: rgba(78,201,176,.14);
    --awino-diff-del: rgba(241,76,76,.14);
    --awino-ok-dim: rgba(78,201,176,.14);
    --awino-danger-dim: rgba(241,76,76,.14);
    --awino-on-vibranium: #000000;
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  body {
    font-family: var(--vscode-font-family, system-ui);
    font-size: var(--vscode-font-size, 13px);
    color: var(--awino-text, var(--vscode-foreground, #DCE7F7));
    background: var(--awino-bg, var(--vscode-sideBar-background, #111A2E));
    margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
    position: relative;
  }

  /* ---------- banner (§2.9) ---------- */
  #banner {
    display: none; padding: 12px; font-size: 12px;
    background: var(--awino-vibranium-dim, rgba(0,198,255,.12));
    border-bottom: 2px solid var(--awino-vibranium-deep, var(--vscode-panel-border, #0B7FA6));
    color: var(--awino-text, var(--vscode-foreground, #DCE7F7));
  }
  #banner.show { display: block; }

  /* ---------- chat header (theme toggle; refinement 2026-09-23) ---------- */
  #chatheader {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    background: var(--awino-bg, var(--vscode-sideBar-background, #111A2E));
    border-bottom: 1px solid var(--vscode-panel-border, #232F45);
    color: var(--awino-text, var(--vscode-foreground, #DCE7F7));
    flex: 0 0 auto;
  }
  #chatheader .brand {
    font-weight: 600; font-size: 12px; letter-spacing: .02em;
    color: var(--awino-gold-bright, var(--vscode-editorWarning-foreground, #F0C94A));
  }
  #chatheader .deco { display: inline-flex; gap: 4px; align-items: center; }
  #chatheader .spacer { flex: 1; }
  #theme-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 3px 9px; border-radius: 10px;
    background: transparent; cursor: pointer;
    border: 1px solid var(--awino-vibranium-deep, var(--vscode-textLink-foreground, #0B7FA6));
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
  }
  #theme-toggle:hover {
    background: var(--awino-vibranium-dim, rgba(0,198,255,.12));
  }
  #theme-toggle:focus-visible, button:focus-visible, #chat:focus-visible {
    outline: 2px solid var(--awino-vibranium, #00C6FF); outline-offset: 1px;
  }

  /* ---------- messages (§2.1) ---------- */
  #messages { flex: 1; overflow-y: auto; padding: 10px; }
  .msg {
    margin-bottom: 12px; padding: 10px 12px; border-radius: 8px;
    background: var(--awino-bg-2, var(--vscode-editor-background, #172036));
    color: var(--awino-text, var(--vscode-foreground, #DCE7F7));
  }
  .msg.user {
    background: var(--awino-bg-3, var(--vscode-input-background, #1E2A45));
    border-left: 3px solid var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
  }
  .msg.turn { border-left: 3px solid var(--awino-vibranium-deep, var(--vscode-textLink-foreground, #0B7FA6)); }
  .msg.error { border-left: 3px solid var(--awino-danger, var(--vscode-testing-iconFailed, #F14C4C)); }
  .msg.warn { border-left: 3px solid var(--awino-warn, var(--vscode-testing-iconQueued, #CCA700)); }
  .said { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }

  /* ---------- chips (§2.2) ---------- */
  .chips { margin: 6px 0; }
  .chip {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-right: 6px;
    background: var(--vscode-badge-background, #4D4D4D);
    color: var(--vscode-badge-foreground, #FFFFFF);
  }
  .chip.phase {
    background: var(--awino-vibranium-dim, rgba(0,198,255,.12));
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    border: 1px solid var(--awino-vibranium-deep, var(--vscode-textLink-foreground, #0B7FA6));
    text-transform: uppercase; font-size: 10px; letter-spacing: .04em;
  }
  .chip.mode {
    background: var(--awino-gold-dim, rgba(212,169,55,.12));
    color: var(--awino-gold-bright, var(--vscode-editorWarning-foreground, #F0C94A));
    border: 1px solid var(--awino-gold, var(--vscode-editorWarning-foreground, #D4A937));
    font-size: 10px; letter-spacing: .04em;
  }
  .chip.persona {
    background: transparent;
    border: 1px dashed var(--awino-gold, var(--vscode-editorWarning-foreground, #D4A937));
    color: var(--awino-gold, var(--vscode-editorWarning-foreground, #D4A937));
  }

  /* ---------- approval cards (§2.3) ---------- */
  .approval {
    position: relative; overflow: hidden;
    background: var(--awino-bg-2, var(--vscode-editor-background, #172036));
    border: 1px solid var(--vscode-panel-border, #232F45);
    border-radius: 8px; padding: 12px; padding-top: 15px; margin: 8px 0;
  }
  .approval::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--awino-chevron);
  }
  .approval h4 { margin: 0 0 6px 0; font-size: 12px; }
  .approval h4 code {
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    font-family: var(--vscode-editor-font-family, monospace);
  }
  pre.diff {
    background: var(--awino-bg, var(--vscode-editor-background, #111A2E));
    color: var(--awino-text, var(--vscode-foreground, #DCE7F7));
    padding: 8px; border-radius: 4px; overflow-x: auto;
    font-size: 11px; max-height: 240px; overflow-y: auto; white-space: pre-wrap;
    font-family: var(--vscode-editor-font-family, monospace);
  }
  .btnrow { margin-top: 8px; display: flex; gap: 8px; }
  button {
    background: var(--vscode-button-background, #0E639C);
    color: var(--vscode-button-foreground, #FFFFFF);
    border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font: inherit;
  }
  button.secondary {
    background: var(--vscode-button-secondaryBackground, #3A3D41);
    color: var(--vscode-button-secondaryForeground, #FFFFFF);
  }
  button:disabled { opacity: .5; cursor: default; }
  .approval button[data-act="approve"] {
    background: linear-gradient(180deg,
      var(--awino-vibranium, var(--vscode-button-background, #00C6FF)),
      var(--awino-vibranium-deep, var(--vscode-button-hoverBackground, #0B7FA6)));
    color: var(--awino-on-vibranium, #04222E);
    font-weight: 600;
  }

  /* ---------- thinking trace (§2.4) ---------- */
  .thinking {
    border-left: 2px dotted var(--awino-gold, var(--vscode-editorWarning-foreground, #D4A937));
    background: var(--awino-thinking-bg, rgba(212,169,55,.05));
    border-radius: 0 6px 6px 0; margin: 8px 0; overflow: hidden;
    font-size: 11px; color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0));
  }
  .thinking > summary {
    cursor: pointer; padding: 6px 10px; list-style: none;
    color: var(--awino-gold, var(--vscode-editorWarning-foreground, #D4A937));
    letter-spacing: .03em; user-select: none;
  }
  .thinking > summary::-webkit-details-marker { display: none; }
  .thinking > summary::before { content: "\25B8  "; }
  .thinking[open] > summary::before { content: "\25BE  "; }
  .thinking .thinking-head { display: inline-flex; align-items: center; gap: 6px; }
  .thinking .thinking-body { padding: 2px 12px 10px 12px; white-space: pre-wrap; line-height: 1.5; }

  /* ---------- harness checks (§2.5) ---------- */
  .checks { margin: 8px 0 2px 0; }
  .checks > summary {
    cursor: pointer; padding: 6px 10px; list-style: none; font-size: 11px;
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    letter-spacing: .03em; user-select: none;
  }
  .checks > summary::-webkit-details-marker { display: none; }
  .checks > summary::before { content: "\25B8  "; }
  .checks[open] > summary::before { content: "\25BE  "; }
  .check-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 10px; font-size: 11px; }
  .check-name {
    font-family: var(--vscode-editor-font-family, monospace);
    color: var(--awino-text, var(--vscode-foreground, #DCE7F7));
  }
  .check-detail { color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0)); }
  .verdict {
    font-size: 10px; padding: 1px 8px; border-radius: 10px; flex: none;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .verdict.pass {
    background: var(--awino-vibranium-dim, rgba(0,198,255,.12));
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
  }
  .verdict.fail {
    background: var(--awino-danger-dim, rgba(241,76,76,.14));
    color: var(--awino-danger, var(--vscode-testing-iconFailed, #F14C4C));
  }
  .verdict.warn {
    background: var(--awino-gold-dim, rgba(212,169,55,.12));
    color: var(--awino-gold, var(--vscode-editorWarning-foreground, #D4A937));
  }

  /* ---------- tool progress rows (§2.6) ---------- */
  .tools-live { margin: 6px 0; }
  .tool-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px; margin: 4px 0;
    background: var(--awino-vibranium-dim, rgba(0,198,255,.12));
    border-radius: 6px; font-size: 11px;
  }
  .tool-row .tname {
    font-family: var(--vscode-editor-font-family, monospace);
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
  }
  .tool-row .tsummary {
    color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0));
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool-row .tms {
    margin-left: auto; flex: none;
    color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0));
  }
  table.tools { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  table.tools td, table.tools th {
    border: 1px solid var(--vscode-panel-border, #232F45);
    padding: 4px 6px; text-align: left;
  }
  table.tools th {
    color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0));
    font-weight: 600;
  }
  table.tools td code {
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    font-family: var(--vscode-editor-font-family, monospace);
  }

  /* ---------- input bar (§2.7) ---------- */
  #inputbar {
    display: flex; padding: 8px; gap: 8px;
    background: var(--awino-bg, var(--vscode-sideBar-background, #111A2E));
    border-top: 1px solid var(--vscode-panel-border, #232F45);
  }
  #input {
    flex: 1;
    background: var(--awino-bg-3, var(--vscode-input-background, #1E2A45));
    color: var(--awino-text, var(--vscode-input-foreground, #DCE7F7));
    border: 1px solid var(--awino-vibranium-deep, var(--vscode-input-border, #0B7FA6));
    border-radius: 8px; padding: 8px; font: inherit; resize: none;
  }
  #input:focus {
    outline: none;
    box-shadow: 0 0 0 1px var(--awino-vibranium, var(--vscode-focusBorder, #00C6FF));
  }
  #input::placeholder { color: var(--awino-muted, var(--vscode-input-placeholderForeground, #8B98B0)); }
  #send {
    background: linear-gradient(180deg,
      var(--awino-vibranium, var(--vscode-button-background, #00C6FF)),
      var(--awino-vibranium-deep, var(--vscode-button-hoverBackground, #0B7FA6)));
    color: var(--awino-on-vibranium, #04222E);
    font-weight: 600; border: none; padding: 6px 18px; border-radius: 6px; cursor: pointer;
  }

  /* ---------- statusline Kimoyo beads (§2.8) ---------- */
  #statusline {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; font-size: 11px;
    color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0));
    background: var(--awino-bg, var(--vscode-sideBar-background, #111A2E));
    border-top: 1px solid var(--vscode-panel-border, #232F45);
  }
  .beads { display: inline-flex; gap: 4px; align-items: center; }
  .bead {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    border: 1px solid var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0));
    background: transparent;
  }
  .bead.on {
    background: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    border-color: transparent;
    box-shadow: 0 0 6px var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
  }
  .bead.working {
    background: var(--awino-gold, var(--vscode-editorWarning-foreground, #D4A937));
    border-color: transparent;
    animation: awino-bead-pulse 1.1s ease-in-out infinite;
  }
  .bead.done {
    background: var(--awino-ok, var(--vscode-testing-iconPassed, #4EC9B0));
    border-color: transparent;
  }
  .bead.alert {
    background: var(--awino-danger, var(--vscode-testing-iconFailed, #F14C4C));
    border-color: transparent;
    animation: awino-bead-pulse 1.1s ease-in-out infinite;
  }
  .bead.vdim {
    background: var(--awino-vibranium-dim, rgba(0,198,255,.12));
    border-color: transparent;
  }
  .bead.gdim {
    background: var(--awino-gold-dim, rgba(212,169,55,.12));
    border-color: transparent;
  }
  @keyframes awino-bead-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  /* ---------- streaming caret ---------- */
  .streaming-caret::after {
    content: "\258D";
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    animation: awino-caret-blink 1s steps(2, start) infinite;
  }
  @keyframes awino-caret-blink { 50% { opacity: 0; } }

  /* ---------- jump-to-latest pill (§4.1) ---------- */
  #jump-latest {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 108px; z-index: 10;
    background: var(--awino-bg-3, var(--vscode-input-background, #1E2A45));
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    border: 1px solid var(--awino-vibranium-deep, var(--vscode-textLink-foreground, #0B7FA6));
    border-radius: 14px; padding: 4px 14px; font-size: 11px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  #jump-latest[hidden] { display: none; }

  /* ---------- markdown content (§4.2–4.4) ---------- */
  code {
    font-family: var(--vscode-editor-font-family, monospace); font-size: 11px;
    background: var(--awino-bg, var(--vscode-editor-background, #111A2E));
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    padding: 1px 4px; border-radius: 3px;
  }
  .md { line-height: 1.5; word-break: break-word; }
  .md p { margin: 6px 0; }
  .md p:first-child { margin-top: 0; }
  .md p:last-child { margin-bottom: 0; }
  .md h3, .md h4, .md h5 {
    margin: 10px 0 4px 0;
    color: var(--awino-text, var(--vscode-foreground, #DCE7F7));
  }
  .md h3 { font-size: 15px; }
  .md h4 { font-size: 14px; }
  .md h5 { font-size: 13px; }
  .md ul, .md ol { margin: 6px 0; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md a { color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF)); }
  .md hr {
    border: none;
    border-top: 1px solid var(--vscode-panel-border, #232F45);
    margin: 10px 0;
  }
  .md blockquote {
    border-left: 2px dotted var(--awino-gold, var(--vscode-editorWarning-foreground, #D4A937));
    margin: 8px 0; padding: 2px 0 2px 10px;
    color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0));
  }
  .md blockquote p { margin: 4px 0; }
  .md code {
    font-family: var(--vscode-editor-font-family, monospace); font-size: 11px;
    background: var(--awino-bg, var(--vscode-editor-background, #111A2E));
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    padding: 1px 4px; border-radius: 3px;
  }
  .codeblock {
    margin: 8px 0;
    border: 1px solid var(--vscode-panel-border, #232F45);
    border-radius: 6px; overflow: hidden;
  }
  .codeblock-header {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--awino-bg-3, var(--vscode-input-background, #1E2A45));
    padding: 4px 8px;
  }
  .codeblock-lang {
    font-family: var(--vscode-editor-font-family, monospace); font-size: 11px;
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
  }
  .copy-btn {
    background: transparent; margin: 0;
    color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0));
    border: 1px solid var(--vscode-panel-border, #232F45);
    font-size: 11px; padding: 2px 10px; border-radius: 4px; cursor: pointer;
  }
  .copy-btn:hover { color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF)); }
  .copy-btn.copied {
    color: var(--awino-ok, var(--vscode-testing-iconPassed, #4EC9B0));
    border-color: var(--awino-ok, var(--vscode-testing-iconPassed, #4EC9B0));
  }
  pre.codeblock-body {
    margin: 0; padding: 8px 10px; font-size: 12px;
    overflow-x: auto; max-height: 400px; overflow-y: auto;
    font-family: var(--vscode-editor-font-family, monospace); white-space: pre;
    background: var(--awino-bg, var(--vscode-editor-background, #111A2E));
    color: var(--awino-text, var(--vscode-foreground, #DCE7F7));
  }
  .diff-add { display: block; background: var(--awino-diff-add, rgba(78,201,176,.14)); }
  .diff-add .dm {
    color: var(--awino-ok, var(--vscode-testing-iconPassed, #4EC9B0));
    font-weight: 700;
  }
  .diff-del { display: block; background: var(--awino-diff-del, rgba(241,76,76,.14)); }
  .diff-del .dm {
    color: var(--awino-danger, var(--vscode-testing-iconFailed, #F14C4C));
    font-weight: 700;
  }
  .diff-hunk {
    display: block;
    color: var(--awino-vibranium, var(--vscode-textLink-foreground, #00C6FF));
    font-weight: 700;
  }
  .diff-ctx { display: block; color: var(--awino-muted, var(--vscode-descriptionForeground, #8B98B0)); }
</style>
</head>
<body>
<div id="chatheader">
  <span class="brand">◈ Awino</span>
  <span class="deco" aria-hidden="true"><span class="bead on"></span><span class="bead vdim"></span><span class="bead gdim"></span></span>
  <span class="spacer"></span>
  <button id="theme-toggle" title="Switch Savanna / Vibranium theme">◐ <span id="theme-name">Vibranium</span></button>
</div>
<div id="banner"></div>
<div id="messages"></div>
<button id="jump-latest" hidden>&#8595; jump to latest</button>
<div id="statusline">not connected</div>
<div id="inputbar">
  <textarea id="input" rows="2" placeholder="Message the loop owner… (a mission starts with the discovery interview)"></textarea>
  <div style="display:flex;flex-direction:column;gap:6px;margin-left:8px;">
    <button id="send">Send</button>
    <button id="stop" class="secondary">Stop</button>
  </div>
</div>
<script src="{{CHAT_JS}}"></script>
</body>
</html>
