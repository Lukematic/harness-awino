<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.W.I.N.O. Mission Chat</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: var(--vscode-font-family, system-ui);
    font-size: var(--vscode-font-size, 13px);
    color: var(--vscode-foreground);
    background: var(--vscode-sideBar-background, #1e1e1e);
    margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
  }
  #banner {
    display: none; padding: 12px; background: var(--vscode-inputValidation-infoBackground, #063b4d);
    border-bottom: 1px solid var(--vscode-panel-border); font-size: 12px;
  }
  #banner.show { display: block; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { margin-bottom: 10px; padding: 8px 10px; border-radius: 6px; background: var(--vscode-editor-background, #252526); }
  .msg.user { background: var(--vscode-input-background, #3c3c3c); border-left: 3px solid var(--vscode-button-background, #0e639c); }
  .msg.turn { border-left: 3px solid var(--vscode-testing-iconPassed, #4ec9b0); }
  .msg.error { border-left: 3px solid var(--vscode-testing-iconFailed, #f14c4c); }
  .msg.warn { border-left: 3px solid var(--vscode-testing-iconQueued, #cca700); }
  .chips { margin: 6px 0; }
  .chip {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-right: 6px;
    background: var(--vscode-badge-background, #4d4d4d); color: var(--vscode-badge-foreground, #fff);
  }
  .chip.phase { background: #0e639c; }
  .chip.mode { background: #6a5acd; }
  .chip.persona { background: #b8860b; }
  pre.diff {
    background: #111; color: #d4d4d4; padding: 8px; border-radius: 4px; overflow-x: auto;
    font-size: 11px; max-height: 240px; overflow-y: auto; white-space: pre-wrap;
  }
  .approval { border: 1px solid var(--vscode-panel-border); border-radius: 6px; padding: 8px; margin: 8px 0; }
  .approval h4 { margin: 0 0 6px 0; }
  .btnrow { margin-top: 8px; }
  button {
    background: var(--vscode-button-background, #0e639c); color: var(--vscode-button-foreground, #fff);
    border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-right: 8px;
  }
  button.secondary { background: var(--vscode-button-secondaryBackground, #3a3d41); }
  button:disabled { opacity: 0.5; cursor: default; }
  table.tools { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  table.tools td, table.tools th { border: 1px solid var(--vscode-panel-border); padding: 4px 6px; text-align: left; }
  #inputbar { display: flex; padding: 8px; border-top: 1px solid var(--vscode-panel-border); }
  #input { flex: 1; background: var(--vscode-input-background); color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border); border-radius: 4px; padding: 8px; font: inherit; resize: none; }
  #statusline { padding: 4px 10px; font-size: 11px; color: var(--vscode-descriptionForeground); border-top: 1px solid var(--vscode-panel-border); }
  .said { white-space: pre-wrap; word-break: break-word; }
  code { background: #111; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="messages"></div>
<div id="statusline">not connected</div>
<div id="inputbar">
  <textarea id="input" rows="2" placeholder="Message the loop owner… (a mission starts with the discovery interview)"></textarea>
  <div style="display:flex;flex-direction:column;gap:6px;margin-left:8px;">
    <button id="send">Send</button>
    <button id="stop" class="secondary">Stop</button>
  </div>
</div>
<script src="{{CHAT_JS}}"></script>
</body>
</html>
